name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Placeholders only: the build needs values, never real secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder-0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder-9f8e7d6c5b4a
      IP_HASH_SECRET: ci-ip-hash-secret-placeholder-0123456789abcdef
      RESEND_API_KEY: re_ci_placeholder_0123456789
      APP_TOKEN_SECRET: ci-app-token-secret-placeholder-0123456789abcdef
      CRON_SECRET: ci-cron-secret-placeholder-0123
      NEXT_PUBLIC_GEOCODING_API_KEY: ci-maptiler-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Fail if any secret reached the client bundle
        run: npm run check:bundle

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-and-e2e:
    name: RLS policy tests and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies migrations and seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - name: RLS and privilege tests (pgTAP)
        run: supabase test db
      - name: Write .env.local for the local stack
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "IP_HASH_SECRET=$(openssl rand -base64 48)"
            echo "SMTP_URL=smtp://127.0.0.1:54325"
            echo "APP_TOKEN_SECRET=$(openssl rand -base64 48)"
            echo "CRON_SECRET=$(openssl rand -hex 24)"
            echo "ADMIN_NOTIFY_EMAIL=admin@wemuste.local"
            echo "NEXT_PUBLIC_GEOCODING_API_KEY=ci-maptiler-placeholder"
          } > .env.local
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (all three roles)
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results/
