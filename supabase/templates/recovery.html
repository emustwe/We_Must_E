<!-- No personal data in this email: no names, no profile details. -->
<div style="margin:0;padding:32px 16px;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#0f172a">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px">
    <p style="margin:0 0 24px;font-size:18px;font-weight:600;color:#1E3A8A">Wemuste</p>
    <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3">Reset your password</h1>
    <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#334155">Someone asked to reset the password for this Wemuste account. If it was you, tap the button below. If not, you can ignore this email.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery"
       style="display:inline-block;background:#1E3A8A;color:#ffffff;text-decoration:none;font-weight:600;font-size:16px;padding:14px 22px;border-radius:12px">Choose a new password</a>
    <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#64748b">This link works once and expires soon. Wemuste will never ask for your password by email or phone.</p>
  </div>
</div>
