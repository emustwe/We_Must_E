<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1120px;height:630px;overflow:hidden;font-family:"Plus Jakarta Sans",sans-serif}
.bg{position:absolute;inset:0;background:url(../../public/brand/map-2026-1600.webp) center/cover;filter:blur(5px) saturate(1.1);transform:scale(1.05)}
.tint{position:absolute;inset:0;background:linear-gradient(105deg,rgba(15,35,110,.94) 0%,rgba(36,87,245,.86) 48%,rgba(36,87,245,.35) 100%)}
.logo{position:absolute;left:56px;top:52px;display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:10px 22px 10px 10px;box-shadow:0 12px 32px rgba(0,0,0,.2)}
.w{width:48px;height:48px;border-radius:14px;background:#2457F5;color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center}
.name{font-weight:800;font-size:25px;letter-spacing:-.5px;color:#0B1220}
.copy{position:absolute;left:56px;top:190px;width:560px;color:#fff}
.k{font-size:20px;font-weight:700;opacity:.85;margin:0 0 14px;letter-spacing:.2px}
h1{margin:0;font-size:58px;line-height:1.06;font-weight:800;letter-spacing:-1.8px}
.sub{margin:22px 0 0;font-size:22px;line-height:1.45;font-weight:600;opacity:.92}
.play{position:absolute;left:760px;top:215px;width:200px;height:200px;border-radius:50%;background:#fff;box-shadow:0 0 0 18px rgba(255,255,255,.22),0 24px 60px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.tri{width:0;height:0;border-top:40px solid transparent;border-bottom:40px solid transparent;border-left:66px solid #2457F5;margin-left:14px}
.chip{position:absolute;left:738px;top:458px;width:244px;text-align:center;background:rgba(11,18,32,.72);color:#fff;font-weight:800;font-size:19px;border-radius:999px;padding:12px 0}
</style></head><body>
<div class="bg"></div><div class="tint"></div>
<div class="logo"><div class="w">W</div><div class="name">WemustE</div></div>
<div class="copy"><p class="k">FOR EMPLOYERS</p><h1>Hire people near your workplace</h1><p class="sub">Tested, interviewed candidates — on a live job map.</p></div>
<div class="play"><div class="tri"></div></div>
<div class="chip">Watch the video</div>
</body></html>
